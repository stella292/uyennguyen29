<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Properties Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .output {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Circle Properties Calculator</h1>
  <label for="radius">Enter the radius of the circle:</label>
  <input type="number" id="radius" placeholder="Enter radius" />
  <button onclick="calculateProperties()">Calculate</button>

  <div class="output" id="circumferenceOutput"></div>
  <div class="output" id="areaOutput"></div>

  <script>
    // Function to calculate circumference
    function calcCircumference(radius) {
      const circumference = 2 * Math.PI * radius;
      return circumference.toFixed(2);
    }

    // Function to calculate area
    function calcArea(radius) {
      const area = Math.PI * Math.pow(radius, 2);
      return area.toFixed(2);
    }

    // Function to handle calculations and update the webpage
    function calculateProperties() {
      const radius = parseFloat(document.getElementById("radius").value);

      if (isNaN(radius) || radius <= 0) {
        alert("Please enter a valid positive number for the radius.");
        return;
      }

      // Calculate and display results
      const circumference = calcCircumference(radius);
      const area = calcArea(radius);

      document.getElementById("circumferenceOutput").textContent =
        `The circumference is ${circumference}`;
      document.getElementById("areaOutput").textContent =
        `The area is ${area}`;
    }
  </script>
</body>
</html>
